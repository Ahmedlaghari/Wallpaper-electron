<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
        }
        /* One transparent canvas per wallpaper window */
        #main-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>
<canvas id="main-canvas"></canvas>

<script>
    const { ipcRenderer } = require("electron");
    const fs              = require("fs");
    const { pathToFileURL } = require("url");
    const clockRenderer   = require("./clock-renderer.js");

    const canvas = document.getElementById("main-canvas");
    // This surface is an overlay above the real Windows wallpaper.  Keep the
    // backing store transparent; the desktop already owns the background.
    const ctx    = canvas.getContext("2d", { alpha: true });


    // ── State ─────────────────────────────────────────────────────────────────────
    let config        = {};
    let displays      = [];     // [{id, bounds, scaleFactor, offsetX, offsetY}, ...]
    let virtualBounds = null;   // local bounds for this window
    let clockTimer    = null;
    const loadedFonts = new Set();

    // Per-monitor video elements (keyed by display id)
    const videoEls = {};
    let wallpaperVisible = !document.hidden;

    // ── Init ──────────────────────────────────────────────────────────────────────
    async function init() {
        const data = await ipcRenderer.invoke("get-live-wallpaper-data");
        await applyData(data);
    }

    async function applyData(data) {
        config   = data.config   || {};
        displays = data.display ? [data.display] : (data.displays || []);

        virtualBounds = data.virtualBounds || computeVirtualBounds(displays);
        displays.forEach(d => {
            d.offsetX = Number.isFinite(d.offsetX) ? d.offsetX : Math.round(d.bounds.x - virtualBounds.x);
            d.offsetY = Number.isFinite(d.offsetY) ? d.offsetY : Math.round(d.bounds.y - virtualBounds.y);
        });

        // We draw everything in logical coordinates; the OS composites to
        // physical pixels via DPI scaling.
        canvas.style.width  = virtualBounds.width  + "px";
        canvas.style.height = virtualBounds.height + "px";
        canvas.width        = virtualBounds.width;
        canvas.height       = virtualBounds.height;

        await loadFonts(data.fonts || []);

        applyVideos();
        startClock();
    }

    function computeVirtualBounds(items) {
        if (!items.length) return { x: 0, y: 0, width: 1, height: 1 };
        const xs  = items.map(d => d.bounds.x);
        const ys  = items.map(d => d.bounds.y);
        const x2s = items.map(d => d.bounds.x + d.bounds.width);
        const y2s = items.map(d => d.bounds.y + d.bounds.height);
        return {
            x:      Math.min(...xs),
            y:      Math.min(...ys),
            width:  Math.max(...x2s) - Math.min(...xs),
            height: Math.max(...y2s) - Math.min(...ys),
        };
    }

    // ── Font loading ──────────────────────────────────────────────────────────────
    // Bundled fonts are loaded privately into this page; only the families the
    // current config uses are decoded.
    async function loadFonts(fontList) {
        const D = clockRenderer.DEFAULTS;
        const wanted = new Set([
            config.dayFont  || D.dayFont,
            config.dateFont || D.dateFont,
            config.timeFont || D.timeFont,
        ]);

        await Promise.all(fontList
            .filter(f => wanted.has(f.family) && !loadedFonts.has(f.family) && fs.existsSync(f.path))
            .map(async ({ family, path }) => {
                try {
                    const face = new FontFace(family, `url("${pathToFileURL(path).href}")`);
                    document.fonts.add(await face.load());
                    loadedFonts.add(family);
                } catch (e) { console.warn(`Font failed: ${family}`, e.message); }
            }));
    }

    // ── Per-monitor video elements ────────────────────────────────────────────────
    function removeVideo(id) {
        videoEls[id].pause();
        videoEls[id].removeAttribute("src");
        videoEls[id].load();
        videoEls[id].remove();
        delete videoEls[id];
    }

    function applyVideos() {
        const videoPath = config.videoPath || "";
        const enabled   = config.videoEnabled && videoPath && fs.existsSync(videoPath);

        // Remove videos for displays that no longer exist
        for (const id of Object.keys(videoEls)) {
            if (!enabled || !displays.find(d => String(d.id) === id)) removeVideo(id);
        }
        if (!enabled) return;

        const src = pathToFileURL(videoPath).href;

        displays.forEach(d => {
            const key = String(d.id);
            let vid = videoEls[key];
            if (!vid) {
                vid = document.createElement("video");
                vid.style.cssText = "position: fixed; object-fit: cover; pointer-events: none; z-index: 5;";
                vid.playsInline = true;
                document.body.appendChild(vid);
                videoEls[key] = vid;
            }

            // Position video exactly over this monitor's region in the virtual desktop
            vid.style.left   = d.offsetX + "px";
            vid.style.top    = d.offsetY + "px";
            vid.style.width  = d.bounds.width  + "px";
            vid.style.height = d.bounds.height + "px";

            const volume = typeof config.videoVolume === "number" ? config.videoVolume : 0;
            vid.volume = volume;
            vid.muted  = volume === 0;
            vid.loop   = config.videoLoop !== false;

            if (vid.getAttribute("data-src") !== src) {
                vid.setAttribute("data-src", src);
                vid.src = src;
                vid.load();
            }
        });

        updateVideoPlayback();
    }

    function updateVideoPlayback() {
        for (const id of Object.keys(videoEls)) {
            const vid = videoEls[id];
            if (!wallpaperVisible) {
                if (!vid.paused) vid.pause();
                continue;
            }
            if (vid.paused) {
                vid.play().catch(e => console.error("Video play:", e.message));
            }
        }
    }

    // ── Clock ─────────────────────────────────────────────────────────────────────
    function redraw() {
        if (!virtualBounds) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = new Date();
        displays.forEach(d => {
            clockRenderer.drawClock(ctx, config, {
                x: d.offsetX, y: d.offsetY, width: d.bounds.width, height: d.bounds.height
            }, now);
        });
    }

    // Repaint only when the drawn clock changes (minute boundary, or every
    // second when seconds are shown) instead of redrawing a full transparent
    // desktop every second.
    function startClock() {
        if (clockTimer) clearTimeout(clockTimer);
        const tick = () => {
            redraw();
            clockTimer = setTimeout(tick, clockRenderer.msUntilNextTick(config));
        };
        tick();
    }

    // ── IPC ───────────────────────────────────────────────────────────────────────
    ipcRenderer.on("live-settings-updated", async () => {
        const data = await ipcRenderer.invoke("get-live-wallpaper-data");
        await applyData(data);
    });

    // Chromium updates document.hidden when the wallpaper is occluded, and
    // the main process covers native hide/minimize transitions as well.
    document.addEventListener("visibilitychange", () => {
        wallpaperVisible = !document.hidden;
        updateVideoPlayback();
    });

    ipcRenderer.on("live-visibility-changed", (_event, visible) => {
        wallpaperVisible = visible === true && !document.hidden;
        updateVideoPlayback();
    });

    init().catch(e => console.error("live.html init error:", e));
</script>
</body>
</html>
