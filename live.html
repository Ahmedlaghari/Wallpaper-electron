<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent;
        }
        /* One transparent canvas per wallpaper window */
        #main-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>
<canvas id="main-canvas"></canvas>

<script>
    const { ipcRenderer } = require("electron");
    const fs              = require("fs");

    const canvas = document.getElementById("main-canvas");
    const ctx    = canvas.getContext("2d");


    // ── State ─────────────────────────────────────────────────────────────────────
    let config       = {};
    let displays     = [];      // [{id, bounds, scaleFactor, physW, physH, offsetX, offsetY}, ...]
    let virtualBounds = null;   // local bounds for this window
    let bgImage      = null;
    let cachedBgPath = null;
    let fonts        = {};
    let fontsLoaded  = false;
    let clockTimer   = null;

    // Per-monitor video elements (keyed by display id)
    const videoEls = {};

    // ── Init ──────────────────────────────────────────────────────────────────────
    async function init() {
        const data = await ipcRenderer.invoke("get-live-wallpaper-data");
        await applyData(data);
    }

    async function applyData(data) {
        config   = data.config   || {};
        displays = data.display ? [data.display] : (data.displays || []);
        fonts    = data.fonts    || {};

        virtualBounds = data.virtualBounds || computeVirtualBounds(displays);
        displays.forEach(d => {
            d.offsetX = Number.isFinite(d.offsetX) ? d.offsetX : Math.round(d.bounds.x - virtualBounds.x);
            d.offsetY = Number.isFinite(d.offsetY) ? d.offsetY : Math.round(d.bounds.y - virtualBounds.y);
        });

        console.log("virtualBounds:", virtualBounds, "displays:", displays.map(d =>
            `id=${d.id} offset=${d.offsetX},${d.offsetY} size=${d.bounds.width}x${d.bounds.height} scale=${d.scaleFactor}`
        ));

        // Canvas CSS size = virtual desktop logical size
        // Canvas pixel buffer = virtual desktop logical size
        // (We draw everything in logical coordinates; the OS composites to physical via DPI scaling)
        canvas.style.width  = virtualBounds.width  + "px";
        canvas.style.height = virtualBounds.height + "px";
        canvas.width        = virtualBounds.width;
        canvas.height       = virtualBounds.height;

        if (!fontsLoaded) await loadFonts();

        await applyBackground(data.backgroundPath);
        applyVideos();
        startClock();
    }

    function computeVirtualBounds(items) {
        if (!items.length) return { x: 0, y: 0, width: 1, height: 1 };
        const xs  = items.map(d => d.bounds.x);
        const ys  = items.map(d => d.bounds.y);
        const x2s = items.map(d => d.bounds.x + d.bounds.width);
        const y2s = items.map(d => d.bounds.y + d.bounds.height);
        return {
            x:      Math.min(...xs),
            y:      Math.min(...ys),
            width:  Math.max(...x2s) - Math.min(...xs),
            height: Math.max(...y2s) - Math.min(...ys),
        };
    }

    // ── Font loading ──────────────────────────────────────────────────────────────
    async function loadFonts() {
        const toLoad = [
            { family: "Anurati",  file: fonts.anurati  },
            { family: "Rajdhani", file: fonts.rajdhani },
            { family: "Poppins",  file: fonts.poppins  },
        ].filter(f => f.file && fs.existsSync(f.file));

        await Promise.all(toLoad.map(async ({ family, file }) => {
            try {
                const font   = new FontFace(family, `url("file://${file.replace(/\\/g, "/")}")`);
                const loaded = await font.load();
                document.fonts.add(loaded);
            } catch (e) { console.warn(`Font failed: ${family}`, e.message); }
        }));
        fontsLoaded = true;
    }

    // ── Background image ──────────────────────────────────────────────────────────
    async function applyBackground(bgPath) {
        if (!bgPath || !fs.existsSync(bgPath)) return;
        if (cachedBgPath !== bgPath || !bgImage) {
            try {
                bgImage      = await loadImg(`file://${bgPath.replace(/\\/g, "/")}`);
                cachedBgPath = bgPath;
            } catch (e) { console.error("BG load failed:", e.message); return; }
        }
        redraw();
    }

    function loadImg(src) {
        return new Promise((res, rej) => {
            const img    = new Image();
            img.onload   = () => res(img);
            img.onerror  = rej;
            img.src      = src;
        });
    }

    // ── Per-monitor video elements ────────────────────────────────────────────────
    function applyVideos() {
        const enabled   = config.videoEnabled && config.videoPath;
        const videoPath = config.videoPath || "";

        // Remove videos for displays that no longer exist
        for (const id of Object.keys(videoEls)) {
            if (!displays.find(d => String(d.id) === id)) {
                videoEls[id].pause();
                videoEls[id].remove();
                delete videoEls[id];
            }
        }

        if (!enabled || !videoPath || !fs.existsSync(videoPath)) {
            // Pause and remove all videos
            for (const id of Object.keys(videoEls)) {
                videoEls[id].pause();
                videoEls[id].remove();
                delete videoEls[id];
            }
            return;
        }

        const src = `file://${videoPath.replace(/\\/g, "/")}`;

        displays.forEach(d => {
            const key = String(d.id);
            let vid = videoEls[key];
            if (!vid) {
                vid = document.createElement("video");
                vid.style.cssText = `
        position: fixed;
        object-fit: cover;
        pointer-events: none;
      `;
                vid.playsinline = true;
                document.body.appendChild(vid);
                videoEls[key] = vid;
            }

            // Position video exactly over this monitor's region in the virtual desktop
            vid.style.left   = d.offsetX + "px";
            vid.style.top    = d.offsetY + "px";
            vid.style.width  = d.bounds.width  + "px";
            vid.style.height = d.bounds.height + "px";

            // z-index above the canvas background but below the clock
            vid.style.zIndex = "5";

            const volume = typeof config.videoVolume === "number" ? config.videoVolume : 0;
            vid.volume = volume;
            vid.muted  = volume === 0;
            vid.loop   = config.videoLoop !== false;

            if (vid.getAttribute("data-src") !== src) {
                vid.setAttribute("data-src", src);
                vid.src = src;
                vid.load();
            }

            if (vid.paused) {
                vid.play().catch(e => console.error("Video play:", e.message));
            }
        });
    }

    // ── Main redraw (background image + clock for all monitors) ──────────────────
    function redraw() {
        if (!virtualBounds) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const videoActive = config.videoEnabled && config.videoPath && fs.existsSync(config.videoPath || "");

        displays.forEach(d => {
            const ox = d.offsetX;
            const oy = d.offsetY;
            const W  = d.bounds.width;
            const H  = d.bounds.height;

            // Draw background image only when no video is covering this monitor
            if (!videoActive && bgImage) {
                const imgR = bgImage.naturalWidth / bgImage.naturalHeight;
                const tgtR = W / H;
                let sx = 0, sy = 0, sw = bgImage.naturalWidth, sh = bgImage.naturalHeight;
                if (imgR > tgtR) {
                    sw = Math.round(sh * tgtR);
                    sx = Math.round((bgImage.naturalWidth - sw) / 2);
                } else {
                    sh = Math.round(sw / tgtR);
                    sy = Math.round((bgImage.naturalHeight - sh) / 2);
                }
                ctx.drawImage(bgImage, sx, sy, sw, sh, ox, oy, W, H);
            }

            // Clock overlay for this monitor
            if (1) {
                drawClockForRegion(ox, oy, W, H);
            }
        });
    }

    // ── Clock drawing (for one monitor's region) ──────────────────────────────────
    function drawClockForRegion(ox, oy, W, H) {
        const showSeconds = config.showSeconds === true;
        const now  = new Date();
        const day  = now.toLocaleDateString("en-US", { weekday: "long" });
        const date = now.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

        const timeOpts = { hour: "2-digit", minute: "2-digit", hour12: config.hour12 !== false };
        if (showSeconds) timeOpts.second = "2-digit";
        const time = now.toLocaleTimeString("en-US", timeOpts);

        ctx.save();
        // Clip drawing to this monitor's region so text doesn't bleed into adjacent monitors
        ctx.beginPath();
        ctx.rect(ox, oy, W, H);
        ctx.clip();

        ctx.fillStyle    = config.fontColor || "white";
        ctx.textBaseline = "alphabetic";
        if (config.shadowEnabled !== false) {
            ctx.shadowBlur  = config.shadowBlur || 40;
            ctx.shadowColor = config.shadowColor || "black";
        } else {
            ctx.shadowBlur  = 0;
            ctx.shadowColor = "transparent";
        }

        const { baseX, baseY, textAlign } = getClockBase(config, W, H);
        const absBaseX = ox + baseX;
        const absBaseY = oy + baseY;

        // ─ Day ─
        const text          = day.toUpperCase();
        const letterSpacing = Number(config.daySpacing ?? 10);
        ctx.font = `${config.daySize || 110}px "${config.dayFont || "Anurati"}"`;

        let totalWidth = 0;
        for (let i = 0; i < text.length; i++) totalWidth += ctx.measureText(text[i]).width;
        totalWidth += letterSpacing * (text.length - 1);

        let startX;
        if (textAlign === "left")       startX = absBaseX;
        else if (textAlign === "right") startX = absBaseX - totalWidth;
        else                            startX = absBaseX - totalWidth / 2;

        let x = startX;
        for (let i = 0; i < text.length; i++) {
            ctx.fillText(text[i], x, absBaseY + (config.dayY ?? -270));
            x += ctx.measureText(text[i]).width + letterSpacing;
        }

        const dayCenterX = startX + totalWidth / 2;
        ctx.textAlign    = "center";

        ctx.font = `${config.dateSize || 45}px "${config.dateFont || "Rajdhani"}"`;
        ctx.fillText(date, dayCenterX, absBaseY + (config.dateY ?? -170));

        ctx.font = `${config.timeSize || 50}px "${config.timeFont || "Rajdhani"}"`;
        ctx.fillText(
            (config.timePrefix ?? "- ") + time + (config.timeSuffix ?? " -"),
            dayCenterX,
            absBaseY + (config.timeY ?? -80)
        );

        ctx.restore();
    }

    function getClockBase(cfg, W, H) {
        const anchor  = cfg.clockAnchor || "middle-center";
        const offsetX = Number(cfg.clockOffsetX) || 0;
        const offsetY = Number(cfg.clockOffsetY) || 0;
        const [vAnchor, hAnchor] = anchor.split("-");
        let baseX, baseY, textAlign;
        if (hAnchor === "left")        { baseX = Math.round(W * 0.08) + offsetX; textAlign = "left"; }
        else if (hAnchor === "right")  { baseX = Math.round(W * 0.92) + offsetX; textAlign = "right"; }
        else                           { baseX = Math.round(W / 2)    + offsetX; textAlign = "center"; }
        if (vAnchor === "top")         baseY = Math.round(H * 0.15) + offsetY;
        else if (vAnchor === "bottom") baseY = Math.round(H * 0.82) + offsetY;
        else                           baseY = Math.round(H / 2)    + offsetY;
        return { baseX, baseY, textAlign };
    }

    // ── Clock ticker ──────────────────────────────────────────────────────────────
    function startClock() {
        if (clockTimer) clearInterval(clockTimer);
        redraw();
        clockTimer = setInterval(redraw, 1000);
    }

    // ── IPC ───────────────────────────────────────────────────────────────────────
    ipcRenderer.on("live-settings-updated", async () => {
        const data = await ipcRenderer.invoke("get-live-wallpaper-data");
        await applyData(data);
    });

    init().catch(e => console.error("live.html init error:", e));
</script>
</body>
</html>
